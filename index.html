<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunCisHax - Premium Game Hub</title>
    <style>
        :root {
            --primary-red: #ff3b30;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(25, 25, 25, 0.7);
            --glass-border: rgba(255, 59, 48, 0.2);
            --text-main: #ffffff;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #440000 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        header h1 {
            text-align: center;
            font-size: 3rem;
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 40px 0;
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.5);
        }

        .search-container { margin-bottom: 40px; position: sticky; top: 20px; z-index: 10; }
        
        #searchInput {
            width: 100%;
            padding: 18px 25px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(20px);
            color: white;
            font-size: 16px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 18px;
            display: flex;
            align-items: center;
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: scale(0.9);
        }

        .game-card.visible { opacity: 1; transform: scale(1); }

        .game-card:hover {
            transform: scale(1.03) translateY(-5px);
            border-color: var(--primary-red);
            background: rgba(40, 40, 40, 0.9);
        }

        .game-icon {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            margin-right: 18px;
            object-fit: cover;
            background: #1a1a1a;
        }

        .game-info h3 { font-size: 17px; margin-bottom: 10px; font-weight: 600; }

        .download-btns { display: flex; gap: 8px; }

        .btn {
            padding: 9px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            transition: 0.2s;
            text-align: center;
            min-width: 85px;
        }

        .btn-adr { background: #fff; color: #000; }
        .btn-ios { background: var(--primary-red); color: #fff; }

        .btn:hover { filter: brightness(0.8); }
        .btn:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .game-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 2.2rem; }
        }
    </style>
</head>

        function renderGames(filter = "") {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";
            const filtered = games.filter(g => g.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach((game, i) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.icon}" class="game-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5260/5260498.png'">
                    <div class="game-info">
                        <h3>${game.name}</h3>
                        <div class="download-btns">
                            <a href="${game.adr}" target="_blank" class="btn btn-adr" onclick="playSound('clickSound')">${game.btn1 || 'ADR'}</a>
                            <a href="${game.ios || game.adr}" target="_blank" class="btn btn-ios" onclick="playSound('clickSound')">${game.btn2 || 'iOS'}</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
                setTimeout(() => card.classList.add('visible'), i * 60);
            });
        }

        function playSound(id) {
            const s = document.getElementById(id);
            s.currentTime = 0;
            s.play().catch(() => {});
        }

        function handleSearch() {
            playSound('thockSound');
            renderGames(document.getElementById('searchInput').value);
        }

        window.onload = () => renderGames();
    </script>
